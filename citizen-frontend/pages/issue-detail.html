<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>FixMyCity — Issue Detail</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<div id="toasts"></div>
<div class="sb-overlay" id="sb-overlay"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">
      <div class="sb-mark">🏙️</div>
      <span class="sb-name">Fix<span>My</span>City</span>
    </div>
    <nav class="sb-nav">
      <div class="sb-item" onclick="safeBack()"><i class="ti ti-home"></i>Feed</div>
      <div class="sb-item" onclick="goPage('post')"><i class="ti ti-plus-circle"></i>Report Issue</div>
      <div class="sb-item" onclick="goPage('profile')"><i class="ti ti-user-circle"></i>My Profile</div>
      <div class="sb-item" data-action="logout"><i class="ti ti-logout"></i>Logout</div>
    </nav>
    <div class="sb-foot"><div class="sb-user" id="sidebar-user"></div></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="ham" id="ham-btn"><i class="ti ti-menu-2"></i></div>
      <div class="back-btn" onclick="safeBack()">
        <i class="ti ti-arrow-left"></i><span>Back</span>
      </div>
      <span class="topbar-title" id="page-title" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <div class="tb-right">
        <button class="btn btn-ghost btn-sm" onclick="shareWhatsApp()" title="Share on WhatsApp">
          <i class="ti ti-brand-whatsapp" style="color:#25D366;font-size:20px"></i>
        </button>
        <button class="btn btn-ghost btn-sm" onclick="shareCopy()" title="Copy link">
          <i class="ti ti-share-2"></i>
        </button>
      </div>
    </header>

    <div class="page">
      <div class="wrap" id="detail-wrap">
        <div class="load-box"><div class="spinner"></div></div>
      </div>
    </div>
  </main>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div class="bn-row">
    <div class="bn-tab" onclick="safeBack()"><i class="ti ti-arrow-left"></i><span>Back</span></div>
    <div class="bn-tab" onclick="goPage('post')"><div class="bn-fab"><i class="ti ti-plus"></i></div></div>
    <div class="bn-tab" onclick="goPage('profile')"><i class="ti ti-user-circle"></i><span>Profile</span></div>
  </div>
</nav>

<!-- ===== CITIZEN COMMENTS DIALOG ===== -->
<div class="overlay" id="cmt-overlay">
  <div class="modal cmt-dialog" style="max-width:580px">
    <div class="modal-top">
      <h3>💬 Comments</h3>
      <div class="modal-x" onclick="closeOverlay('cmt-overlay')"><i class="ti ti-x"></i></div>
    </div>
    <!-- Comment type tabs -->
    <div style="padding:10px 18px 0;border-bottom:1px solid var(--b1);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0">
      <div class="chip on" data-ct="comment"   onclick="setCmtType('comment',this)">💬 Comment</div>
      <div class="chip"    data-ct="escalation" onclick="setCmtType('escalation',this)">🚨 Escalate</div>
      <div class="chip"    data-ct="appreciation" onclick="setCmtType('appreciation',this)">👏 Appreciate</div>
      <div class="chip"    data-ct="review"     onclick="setCmtType('review',this)">⭐ Review</div>
    </div>
    <!-- Star rating (review only) -->
    <div id="star-section" style="display:none;padding:10px 18px 0;flex-shrink:0">
      <div class="label">Rating</div>
      <div class="stars-inp" id="star-inp">
        <span class="star" onclick="setStar(1)">★</span>
        <span class="star" onclick="setStar(2)">★</span>
        <span class="star" onclick="setStar(3)">★</span>
        <span class="star" onclick="setStar(4)">★</span>
        <span class="star" onclick="setStar(5)">★</span>
      </div>
    </div>
    <!-- Comment list -->
    <div class="modal-body" style="flex:1;overflow-y:auto;padding:0" id="cmt-list-wrap">
      <div class="cmt-list" id="cmt-list"><div class="load-box"><div class="spinner"></div></div></div>
    </div>
    <!-- Input box -->
    <div class="cmt-input-box">
      <div style="display:flex;gap:8px;align-items:flex-end">
        <textarea class="ta" id="cmt-inp" placeholder="Write a comment…" rows="2" style="flex:1;min-height:40px;max-height:100px;resize:none"></textarea>
        <button class="btn btn-primary btn-sm" id="cmt-send-btn" onclick="sendComment()" style="flex-shrink:0;height:40px">
          <i class="ti ti-send"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ===== MUNICIPAL RESPONSE COMMENTS DIALOG ===== -->
<div class="overlay" id="muni-cmt-overlay">
  <div class="modal cmt-dialog" style="max-width:580px">
    <div class="modal-top">
      <h3>🏛️ Municipal Response — Comments</h3>
      <div class="modal-x" onclick="closeOverlay('muni-cmt-overlay')"><i class="ti ti-x"></i></div>
    </div>
    <div class="modal-body" style="flex:1;overflow-y:auto;padding:0" id="muni-cmt-list-wrap">
      <div class="cmt-list" id="muni-cmt-list"><div class="load-box"><div class="spinner"></div></div></div>
    </div>
    <div class="cmt-input-box">
      <div style="display:flex;gap:8px;align-items:flex-end">
        <textarea class="ta" id="muni-cmt-inp" placeholder="Comment on the municipal response…" rows="2" style="flex:1;min-height:40px;max-height:100px;resize:none"></textarea>
        <button class="btn btn-primary btn-sm" id="muni-send-btn" onclick="sendMuniComment()" style="flex-shrink:0;height:40px">
          <i class="ti ti-send"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ===== REOPEN DIALOG ===== -->
<div class="overlay" id="reopen-overlay">
  <div class="modal" style="max-width:480px">
    <div class="modal-top">
      <h3>🔴 Reopen Issue</h3>
      <div class="modal-x" onclick="closeOverlay('reopen-overlay')"><i class="ti ti-x"></i></div>
    </div>
    <div class="modal-body">
      <p class="text-sm muted mb-3">Describe why this issue is NOT resolved. Anyone in your area can see this.</p>
      <div class="fg">
        <label class="label">Reason <span class="req">*</span></label>
        <textarea class="ta" id="reopen-reason" placeholder="e.g. The pothole has reopened after rain…" rows="4"></textarea>
      </div>
      <div class="fg">
        <label class="label">Attach Evidence <span style="color:var(--t3);font-weight:400">(optional)</span></label>
        <div class="drop-zone" onclick="document.getElementById('reopen-file').click()" style="padding:14px">
          <i class="ti ti-photo-plus"></i>
          <p>Add photos/videos as proof</p>
        </div>
        <input type="file" id="reopen-file" accept="image/*,video/*" multiple style="display:none" onchange="previewReopenFiles(this.files)">
        <div class="previews-grid" id="reopen-previews"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeOverlay('reopen-overlay')">Cancel</button>
      <button class="btn btn-danger" id="reopen-btn" onclick="submitReopen()">
        <i class="ti ti-refresh-alert"></i> Reopen Issue
      </button>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:9999;align-items:center;justify-content:center;padding:20px;animation:popIn .2s ease">
  <button onclick="closeLB()" style="position:absolute;top:14px;right:14px;color:#fff;font-size:28px;background:none;border:none;cursor:pointer;z-index:1"><i class="ti ti-x"></i></button>
  <img id="lb-img" src="" style="max-width:90vw;max-height:90vh;object-fit:contain;border-radius:10px">
</div>

<script src="../js/app.js"></script>
<script>
const issueId = new URLSearchParams(window.location.search).get('id');
if (!issueId) window.location.href = '/';

let issue = null;
let cmtType = 'comment';
let starVal = 0;
let reopenFiles = [];

// ---- SAFE BACK (fixes mobile back button) ----
function safeBack() {
  if (document.referrer && document.referrer.includes(window.location.hostname)) {
    history.back();
  } else {
    window.location.href = '/';
  }
}

// ---- SHARE ----
function shareWhatsApp() {
  const url = encodeURIComponent(window.location.href);
  const txt = encodeURIComponent(`Check out this civic issue on FixMyCity: ${issue?.title || ''}`);
  window.open(`https://wa.me/?text=${txt}%20${url}`, '_blank');
}
function shareCopy() {
  navigator.clipboard.writeText(window.location.href)
    .then(() => toast('Link copied!', 'ok'))
    .catch(() => toast('Could not copy link', 'err'));
}

// ---- LOAD ISSUE ----
async function loadIssue() {
  try {
    const data = await api.get(`/issues/${issueId}`);
    issue = data.issue;
    document.getElementById('page-title').textContent = issue.title;
    document.title = `FixMyCity — ${issue.title}`;
    renderDetail(issue, data.comments || []);
  } catch(err) {
    document.getElementById('detail-wrap').innerHTML = `
      <div class="empty">
        <div class="empty-icon"><i class="ti ti-alert-circle"></i></div>
        <h3>Issue not found</h3>
        <p>${err.message}</p>
        <button class="btn btn-secondary" onclick="safeBack()"><i class="ti ti-arrow-left"></i> Go Back</button>
      </div>`;
  }
}

function statusBadge(s) {
  const m = {open:'🔵 Open',in_progress:'🟡 In Progress',resolved:'✅ Resolved',reopened:'🔴 Reopened',closed:'⚫ Closed'};
  return `<span class="badge b-${s}">${m[s]||s}</span>`;
}

function renderDetail(iss, comments) {
  const user = Auth.getUser();
  const isAuthor = user && String(iss.postedBy?._id) === String(user._id);
  const isMuni   = Auth.isMunicipal();
  const resolved = iss.status === 'resolved';
  const canDel   = isAuthor && !iss.resolution?.resolvedAt;
  const canReopen= Auth.isLoggedIn() && resolved;
  const author   = iss.isAnonymous ? {name:'Anonymous',profilePhoto:{url:''}} : iss.postedBy;

  // Full media (clickable)
  const fullMedia = (iss.media||[]).map(m => {
    if (m.resourceType === 'video') return `<div class="mi"><video src="${m.url}" controls style="width:100%;max-height:340px;object-fit:cover"></video></div>`;
    return `<div class="mi" onclick="openLB('${m.url}')" style="cursor:zoom-in"><img src="${m.url}" alt="" style="width:100%;max-height:340px;object-fit:cover"></div>`;
  }).join('');
  const mediaGrid = iss.media?.length ? `<div class="mgrid g${Math.min(iss.media.length,4)}" style="border-radius:var(--r2);overflow:hidden;margin-bottom:14px">${fullMedia}</div>` : '';

  const html = `
  <!-- Main issue card -->
  <div class="card mb-3" style="animation:fadeUp .3s ease">
    <div class="card-body">
      <!-- Author row -->
      <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:14px">
        ${avatarHtml(author, 40)}
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px">
            <span style="font-weight:600;font-size:.9rem">${author?.name||'Anonymous'}</span>
            ${iss.isAnonymous?'<span class="badge" style="background:var(--bg5);color:var(--t3);font-size:.6rem">Anon</span>':''}
            ${statusBadge(iss.status)}
            <span class="cat-b"><i class="ti ${CATS[iss.category]?.icon||'ti-map-pin'}"></i>${CATS[iss.category]?.label||iss.category}</span>
          </div>
          <div style="font-size:.74rem;color:var(--t3);display:flex;align-items:center;gap:4px">
            <i class="ti ti-map-pin" style="font-size:11px"></i>
            ${iss.location.address?iss.location.address.split(',').slice(0,2).join(',')+' · ':''}
            ${iss.location.city}, ${iss.location.district}, ${iss.location.state}
            ${iss.location.pincode?' — '+iss.location.pincode:''}
          </div>
          <div style="font-size:.72rem;color:var(--t3);margin-top:2px">
            <i class="ti ti-clock" style="font-size:10px"></i> ${fmtDate(iss.createdAt)}
          </div>
        </div>
        ${canDel?`<button class="btn btn-ghost btn-sm" style="color:var(--red);flex-shrink:0" onclick="deleteIssue()"><i class="ti ti-trash"></i></button>`:''}
      </div>

      <!-- Title & description -->
      <h2 style="font-size:1.2rem;margin-bottom:8px;line-height:1.3">${iss.title}</h2>
      <p style="font-size:.88rem;color:var(--t2);line-height:1.7;white-space:pre-wrap;margin-bottom:14px">${iss.description}</p>

      <!-- Media -->
      ${mediaGrid}

      <!-- Stats row -->
      <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--b1);border-bottom:1px solid var(--b1)">
        <div class="ic-act ${iss._uv?'up':''}" id="upvote-btn" onclick="doUpvote(event,'${iss._id}',document.getElementById('upvote-btn'))">
          <i class="ti ti-arrow-up"></i><span id="uv-count">${iss.upvoteCount||0}</span> upvotes
        </div>
        <div class="ic-act" onclick="openCmtDialog()">
          <i class="ti ti-message-circle"></i><span>${comments.length}</span> comments
        </div>
        <div class="ic-act ic-ml" onclick="shareWhatsApp()">
          <i class="ti ti-brand-whatsapp" style="color:#25D366"></i>
        </div>
        <div class="ic-act" onclick="shareCopy()">
          <i class="ti ti-share-2"></i>
        </div>
      </div>

      <!-- Action buttons -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:12px">
        ${Auth.isLoggedIn()?`<button class="btn btn-secondary btn-sm" onclick="openCmtDialog()"><i class="ti ti-message-plus"></i> Comment</button>`:''}
        ${canReopen?`<button class="btn btn-sm" style="background:var(--ybd);color:var(--amber);border:1px solid rgba(245,158,11,.3)" onclick="openOverlay('reopen-overlay')"><i class="ti ti-refresh-alert"></i> Reopen Issue</button>`:''}
        ${isMuni?`<a href="../municipal-frontend/pages/dashboard.html" class="btn btn-sm" style="background:var(--abg);color:var(--a);border:1px solid var(--b2)"><i class="ti ti-building-community"></i> Municipal Dashboard</a>`:''}
      </div>
    </div>

    <!-- Resolved bar -->
    ${resolved?`<div class="res-bar"><i class="ti ti-circle-check" style="font-size:16px"></i><span>Resolved on ${fmtDate(iss.resolution.resolvedAt)}</span>${iss.resolution.description?`<span style="color:var(--t3);margin-left:4px">· ${iss.resolution.description.slice(0,80)}${iss.resolution.description.length>80?'…':''}</span>`:''}</div>`:''}
  </div>

  ${renderResolution(iss)}
  ${renderReopenHistory(iss)}

  <!-- Comments summary (click to open dialog) -->
  <div class="card" style="cursor:pointer;animation:fadeUp .4s ease" onclick="openCmtDialog()">
    <div style="padding:14px 18px;display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:8px">
        <i class="ti ti-message-circle" style="color:var(--a);font-size:20px"></i>
        <span style="font-weight:600">Comments (${comments.length})</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;color:var(--t3);font-size:.82rem">
        <span>View all</span><i class="ti ti-chevron-right"></i>
      </div>
    </div>
    ${comments.length>0?`
    <div style="padding:0 18px 14px">
      ${comments.slice(0,2).map(c=>`
      <div style="display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--b1)">
        ${avatarHtml(c.author,28)}
        <div>
          <span style="font-size:.8rem;font-weight:600;color:var(--t1)">${c.author?.name||'User'}</span>
          <span style="font-size:.75rem;color:var(--t3);margin-left:6px">${ago(c.createdAt)}</span>
          <div style="font-size:.82rem;color:var(--t2);margin-top:2px">${c.text.slice(0,80)}${c.text.length>80?'…':''}</div>
        </div>
      </div>`).join('')}
      ${comments.length>2?`<div style="text-align:center;padding-top:8px;font-size:.8rem;color:var(--a)">+ ${comments.length-2} more comments</div>`:''}
    </div>`:`<div style="padding:14px 18px;text-align:center;font-size:.83rem;color:var(--t3);border-top:1px solid var(--b1)">No comments yet — be the first!</div>`}
  </div>
  `;

  document.getElementById('detail-wrap').innerHTML = html;
  // Store comments for dialog
  window._comments = comments;
}

function renderResolution(iss) {
  if (!iss.resolution?.resolvedAt) return '';
  const r = iss.resolution;
  const mediaHtml = (r.media||[]).map(m => m.resourceType==='video'
    ? `<div class="mi"><video src="${m.url}" controls style="width:100%;max-height:280px;object-fit:cover"></video></div>`
    : `<div class="mi" onclick="openLB('${m.url}')" style="cursor:zoom-in"><img src="${m.url}" style="width:100%;max-height:280px;object-fit:cover"></div>`
  ).join('');

  return `
  <div class="card mb-3" style="border:1px solid var(--gbd);animation:fadeUp .35s ease">
    <div style="padding:14px 18px;background:var(--gbg);display:flex;align-items:flex-start;gap:10px">
      <i class="ti ti-building-community" style="color:var(--green);font-size:22px;flex-shrink:0;margin-top:2px"></i>
      <div style="flex:1">
        <div style="font-weight:700;color:var(--green);font-size:.95rem">Municipal Response — Issue Resolved</div>
        <div style="font-size:.74rem;color:var(--t3)">By ${r.resolvedBy?.name||'Municipal Team'} · ${fmtDate(r.resolvedAt)}</div>
      </div>
    </div>
    <div class="card-body">
      ${r.description?`<p style="color:var(--t2);line-height:1.7;margin-bottom:${r.media?.length?'14px':'0'}">${r.description}</p>`:''}
      ${r.media?.length?`<div class="mgrid g${Math.min(r.media.length,4)}" style="border-radius:var(--r2);overflow:hidden;margin-bottom:14px">${mediaHtml}</div>`:''}
      <!-- Municipal response comment button -->
      <button class="btn btn-secondary btn-sm" onclick="openMuniCmtDialog()" style="margin-top:4px">
        <i class="ti ti-message-circle"></i> Comments on this resolution
      </button>
    </div>
  </div>`;
}

function renderReopenHistory(iss) {
  if (!iss.reopenHistory?.length) return '';
  return iss.reopenHistory.map(r=>`
  <div class="card mb-3" style="border:1px solid rgba(245,158,11,.25);animation:fadeUp .4s ease">
    <div style="padding:12px 18px;background:var(--ybd);display:flex;align-items:center;gap:8px">
      <i class="ti ti-refresh-alert" style="color:var(--amber);font-size:18px"></i>
      <div>
        <div style="font-weight:600;color:var(--amber);font-size:.9rem">Issue Reopened</div>
        <div style="font-size:.73rem;color:var(--t3)">By ${r.reopenedBy?.name||'A citizen'} · ${fmtDate(r.reopenedAt)}</div>
      </div>
    </div>
    <div class="card-body">
      <p style="color:var(--t2);font-size:.86rem">${r.reason||'No reason given'}</p>
    </div>
  </div>`).join('');
}

// ---- CITIZEN COMMENTS DIALOG ----
function openCmtDialog() {
  openOverlay('cmt-overlay');
  renderComments(window._comments||[]);
}

function renderComments(comments) {
  const list = document.getElementById('cmt-list');
  if (!comments.length) {
    list.innerHTML = `<div class="empty" style="padding:30px 20px"><div class="empty-icon" style="font-size:32px"><i class="ti ti-message-circle-off"></i></div><p>No comments yet. Be the first!</p></div>`;
    return;
  }
  const user = Auth.getUser();
  list.innerHTML = comments.map(c=>{
    const isOwn = user && String(c.author?._id) === String(user._id);
    const typeMap = {escalation:'escalation',appreciation:'appreciation',review:'review',reopen:'reopen'};
    const stars = c.type==='review'&&c.rating ? `<div class="c-stars">${'★'.repeat(c.rating)}${'☆'.repeat(5-c.rating)}</div>` : '';
    return `
    <div class="comment-item" id="cmt-${c._id}">
      ${avatarHtml(c.author,30)}
      <div class="c-body">
        <div class="c-top">
          <span class="c-name">${c.author?.name||'User'}</span>
          ${c.author?.role==='municipal'?'<span class="badge b-in_progress" style="font-size:.6rem">🏛️ Municipal</span>':''}
          ${typeMap[c.type]?`<span class="c-type ${c.type}">${{escalation:'🚨 Escalation',appreciation:'👏 Appreciation',review:'⭐ Review',reopen:'🔴 Reopen'}[c.type]}</span>`:''}
          <span class="c-time">${ago(c.createdAt)}</span>
        </div>
        ${stars}
        <div class="c-text">${c.text}</div>
        <div class="c-acts">
          <span class="c-btn ${c._liked?'liked':''}" onclick="likeCmt('${c._id}',this)">
            <i class="ti ti-heart"></i> ${c.likeCount||0}
          </span>
          ${isOwn?`<span class="c-btn" style="color:var(--red)" onclick="deleteCmt('${c._id}')"><i class="ti ti-trash"></i> Delete</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function setCmtType(type, btn) {
  cmtType = type;
  document.querySelectorAll('[data-ct]').forEach(c=>c.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('star-section').style.display = type==='review' ? 'block' : 'none';
}

function setStar(n) {
  starVal = n;
  document.querySelectorAll('#star-inp .star').forEach((s,i) => s.classList.toggle('on', i<n));
}

async function sendComment() {
  if (!requireAuth()) return;
  const text = document.getElementById('cmt-inp').value.trim();
  if (!text) { toast('Write something first','err'); return; }
  if (cmtType==='review' && !starVal) { toast('Please select a star rating','err'); return; }
  const btn = document.getElementById('cmt-send-btn');
  btn.disabled = true;
  try {
    const res = await api.post(`/comments/${issueId}`, { text, type: cmtType, rating: starVal||undefined });
    document.getElementById('cmt-inp').value = '';
    starVal = 0;
    document.querySelectorAll('#star-inp .star').forEach(s=>s.classList.remove('on'));
    // Reload comments
    const data = await api.get(`/issues/${issueId}`);
    window._comments = data.comments||[];
    renderComments(window._comments);
    toast('Comment posted!','ok');
  } catch(err){ toast(err.message,'err'); }
  finally { btn.disabled=false; }
}

async function likeCmt(id, el) {
  if (!requireAuth()) return;
  try {
    const r = await api.post(`/comments/${id}/like`);
    el.innerHTML = `<i class="ti ti-heart"></i> ${r.likeCount}`;
    el.classList.toggle('liked', r.hasLiked);
  } catch(err){ toast(err.message,'err'); }
}

async function deleteCmt(id) {
  if (!confirm('Delete this comment?')) return;
  try {
    await api.del(`/comments/${id}`);
    document.getElementById(`cmt-${id}`)?.remove();
    toast('Comment deleted','ok');
  } catch(err){ toast(err.message,'err'); }
}

// ---- MUNICIPAL RESPONSE COMMENTS ----
async function openMuniCmtDialog() {
  openOverlay('muni-cmt-overlay');
  const list = document.getElementById('muni-cmt-list');
  list.innerHTML = '<div class="load-box"><div class="spinner"></div></div>';
  try {
    const data = await api.get(`/municipal-comments/${issueId}`);
    renderMuniComments(data.comments||[]);
  } catch(err){ list.innerHTML=`<p style="text-align:center;color:var(--red);padding:20px">${err.message}</p>`; }
}

function renderMuniComments(comments) {
  const list = document.getElementById('muni-cmt-list');
  if (!comments.length) {
    list.innerHTML = `<div class="empty" style="padding:30px 20px"><div class="empty-icon" style="font-size:32px"><i class="ti ti-message-circle-off"></i></div><p>No comments on this resolution yet.</p></div>`;
    return;
  }
  const user = Auth.getUser();
  list.innerHTML = `<div class="cmt-list">${comments.map(c=>{
    const isOwn = user && String(c.author?._id)===String(user._id);
    return `<div class="comment-item" id="mc-${c._id}">
      ${avatarHtml(c.author,30)}
      <div class="c-body">
        <div class="c-top">
          <span class="c-name">${c.author?.name||'User'}</span>
          ${c.author?.role==='municipal'?'<span class="badge b-in_progress" style="font-size:.6rem">🏛️ Municipal</span>':''}
          <span class="c-time">${ago(c.createdAt)}</span>
        </div>
        <div class="c-text">${c.text}</div>
        <div class="c-acts">
          <span class="c-btn" onclick="likeMuniCmt('${c._id}',this)"><i class="ti ti-heart"></i> ${c.likeCount||0}</span>
          ${isOwn?`<span class="c-btn" style="color:var(--red)" onclick="deleteMuniCmt('${c._id}')"><i class="ti ti-trash"></i></span>`:''}
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

async function sendMuniComment() {
  if (!requireAuth()) return;
  const text = document.getElementById('muni-cmt-inp').value.trim();
  if (!text) { toast('Write something first','err'); return; }
  const btn = document.getElementById('muni-send-btn');
  btn.disabled = true;
  try {
    await api.post(`/municipal-comments/${issueId}`, { text });
    document.getElementById('muni-cmt-inp').value = '';
    // Reload
    const data = await api.get(`/municipal-comments/${issueId}`);
    renderMuniComments(data.comments||[]);
    toast('Comment posted!','ok');
  } catch(err){ toast(err.message,'err'); }
  finally{ btn.disabled=false; }
}

async function likeMuniCmt(id, el) {
  if (!requireAuth()) return;
  try {
    const r = await api.post(`/municipal-comments/${id}/like`);
    el.innerHTML = `<i class="ti ti-heart"></i> ${r.likeCount}`;
    el.classList.toggle('liked', r.hasLiked);
  } catch{}
}

async function deleteMuniCmt(id) {
  if (!confirm('Delete this comment?')) return;
  try {
    await api.del(`/municipal-comments/${id}`);
    document.getElementById(`mc-${id}`)?.remove();
    toast('Deleted','ok');
  } catch(err){ toast(err.message,'err'); }
}

// ---- REOPEN ----
function previewReopenFiles(files) {
  reopenFiles = Array.from(files).slice(0,3);
  const prev = document.getElementById('reopen-previews');
  prev.innerHTML = '';
  reopenFiles.forEach(f=>{
    const div = document.createElement('div'); div.className='prev';
    const url = URL.createObjectURL(f);
    div.innerHTML = f.type.startsWith('video/') ? `<video src="${url}" style="width:100%;height:80px;object-fit:cover"></video>` : `<img src="${url}" style="width:100%;height:80px;object-fit:cover">`;
    prev.appendChild(div);
  });
}

async function submitReopen() {
  const reason = document.getElementById('reopen-reason').value.trim();
  if (!reason) { toast('Please explain why you are reopening','err'); return; }
  const btn = document.getElementById('reopen-btn');
  btn.disabled=true; btn.innerHTML='<span class="btn-spin"></span> Reopening…';
  const fd = new FormData();
  fd.append('reason', reason);
  reopenFiles.forEach(f=>fd.append('media',f));
  try {
    await api.upload(`/issues/${issueId}/reopen`, fd);
    closeOverlay('reopen-overlay');
    toast('Issue reopened — municipal team notified','ok');
    loadIssue();
  } catch(err){ toast(err.message,'err'); }
  finally{ btn.disabled=false; btn.innerHTML='<i class="ti ti-refresh-alert"></i> Reopen Issue'; }
}

// ---- DELETE ISSUE ----
async function deleteIssue() {
  if (!confirm('Delete this issue? This cannot be undone.')) return;
  try {
    await api.del(`/issues/${issueId}`);
    toast('Issue deleted','ok');
    setTimeout(()=>window.location.href='/', 600);
  } catch(err){ toast(err.message,'err'); }
}

// ---- LIGHTBOX ----
function openLB(url) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lb-img').src = url;
  lb.style.display = 'flex';
}
function closeLB() { document.getElementById('lightbox').style.display='none'; }
document.getElementById('lightbox').addEventListener('click',e=>{ if(e.target.id==='lightbox') closeLB(); });

// ---- OVERLAY HELPERS ----
function openOverlay(id) { document.getElementById(id).classList.add('on'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('on'); }
document.querySelectorAll('.overlay').forEach(o=>{
  o.addEventListener('click', e=>{ if(e.target===o) o.classList.remove('on'); });
});

// ---- SIDEBAR MOBILE ----
document.getElementById('ham-btn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.add('on');
  document.getElementById('sb-overlay').classList.add('on');
});
document.getElementById('sb-overlay').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('on');
  document.getElementById('sb-overlay').classList.remove('on');
});

// Helper
function avatarHtml(user, size=36) {
  const s=`width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;background:var(--bg5);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${Math.floor(size*.35)}px;color:var(--a);flex-shrink:0`;
  if(user?.profilePhoto?.url) return `<div style="${s}"><img src="${user.profilePhoto.url}" style="width:100%;height:100%;object-fit:cover" alt=""></div>`;
  return `<div style="${s}">${(user?.name||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()}</div>`;
}

document.addEventListener('DOMContentLoaded', loadIssue);
</script>
</body>
