<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>FixMyCity — Municipal Portal Login</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<div id="toasts"></div>

<div class="auth-page">
  <div class="auth-glow tl"></div>
  <div class="auth-glow br"></div>

  <div class="auth-card" style="max-width:420px">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-icon" style="background:linear-gradient(135deg,#4f46e5,#7c3aed)">🏛️</div>
      <h2>Municipal <span>Portal</span></h2>
      <p>FixMyCity — Official Worker Access</p>
    </div>

    <!-- Notice -->
    <div style="background:var(--abg);border:1px solid var(--b2);border-radius:var(--r2);padding:10px 14px;margin-bottom:18px;font-size:.8rem;color:var(--a);display:flex;align-items:center;gap:8px">
      <i class="ti ti-shield-check" style="font-size:16px;flex-shrink:0"></i>
      <span>This portal is for verified municipal corporation workers only. Citizens — <a href="http://localhost:3000" style="color:var(--a2);font-weight:600">use the Citizen App</a>.</span>
    </div>

    <form onsubmit="doLogin(event)">
      <div class="fg">
        <label class="label">Official Email Address <span class="req">*</span></label>
        <div class="iw">
          <i class="ti ti-mail pre"></i>
          <input class="inp" type="email" id="email" placeholder="your.name@municipality.gov.in" autocomplete="email" required>
        </div>
      </div>
      <div class="fg">
        <label class="label">Password <span class="req">*</span></label>
        <div class="iw">
          <i class="ti ti-lock pre"></i>
          <input class="inp" type="password" id="pwd" placeholder="Enter your password" required autocomplete="current-password">
          <i class="ti ti-eye eye" id="eye" onclick="toggleEye()"></i>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <label class="check-row">
          <input type="checkbox" id="remember">
          <span>Remember me</span>
        </label>
      </div>

      <div id="err" class="hidden" style="color:var(--red);font-size:.83rem;margin-bottom:12px;padding:9px 12px;background:var(--rbd);border-radius:var(--r2);border:1px solid rgba(239,68,68,.2)"></div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">
        <i class="ti ti-login"></i> Login to Portal
      </button>
    </form>

    <div style="margin-top:20px;padding:14px;background:var(--bg4);border-radius:var(--r2);border:1px solid var(--b1)">
      <div style="font-size:.78rem;font-weight:600;color:var(--t2);margin-bottom:8px">New municipal worker?</div>
      <p style="font-size:.76rem;color:var(--t3);margin-bottom:10px">Register your official account to manage civic issues in your area.</p>
      <a href="register.html" class="btn btn-secondary btn-sm btn-full">
        <i class="ti ti-user-plus"></i> Register as Municipal Worker
      </a>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
if (Auth.isLoggedIn() && Auth.isMunicipal()) window.location.href = '/pages/dashboard.html';

// Pre-fill remembered email
const rem = localStorage.getItem('fmc_m_remember');
if (rem) { document.getElementById('email').value=rem; document.getElementById('remember').checked=true; }

function toggleEye() {
  const el=document.getElementById('pwd'), ic=document.getElementById('eye');
  if (el.type==='password') { el.type='text'; ic.className='ti ti-eye-off eye'; }
  else { el.type='password'; ic.className='ti ti-eye eye'; }
}

async function doLogin(e) {
  e.preventDefault();
  const errEl = document.getElementById('err');
  errEl.classList.add('hidden');
  const email = document.getElementById('email').value.trim();
  const pwd   = document.getElementById('pwd').value;
  const rem   = document.getElementById('remember').checked;
  const btn   = document.getElementById('login-btn');
  btn.disabled=true; btn.innerHTML='<span class="btn-spin"></span> Logging in…';
  try {
    const res = await api.post('/auth/login', { email, password:pwd });
    if (res.user.role !== 'municipal' && res.user.role !== 'admin') {
      throw new Error('Access denied — this portal is for municipal workers only. Please use the Citizen App.');
    }
    if (rem) localStorage.setItem('fmc_m_remember', email);
    else localStorage.removeItem('fmc_m_remember');
    Auth.set(res.token, res.user);
    toast(`Welcome, ${res.user.name}! 👋`, 'ok');
    setTimeout(() => window.location.href='/pages/dashboard.html', 500);
  } catch(err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
    btn.disabled=false; btn.innerHTML='<i class="ti ti-login"></i> Login to Portal';
  }
}
</script>
</body>
</html>
